name: "Integrate"

on:
  pull_request: ~
  push:
    branches:
      - 5.x
  schedule:
    - cron: "0 10 * * 6"

env:
  # Psalm requires this plugin, and the checkout has no tags to guess its version from: without it, Composer installs
  # an old Psalm release candidate that did not require the plugin.
  COMPOSER_ROOT_VERSION: 5.x-dev

jobs:
  static-code-analysis:
    name: "Static Code Analysis (PHP: ${{matrix.php-version}}, deps: ${{matrix.dependencies}})"

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - 8.2
          - 8.3
          - 8.4
          - 8.5

        dependencies:
          - highest
          - lowest

        exclude:
          - php-version: 8.4
            dependencies: lowest
          - php-version: 8.5
            dependencies: lowest

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Install PHP with extensions"
        uses: shivammathur/setup-php@v2
        with:
          coverage: none
          php-version: ${{ matrix.php-version }}

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: "Cache cache directory for vimeo/psalm"
        uses: actions/cache@v6
        with:
          path: .build/psalm
          key: php-${{ matrix.php-version }}-psalm-${{ github.sha }}
          restore-keys: php-${{ matrix.php-version }}-psalm-

      - name: "Run vimeo/psalm"
        run: vendor/bin/psalm --find-dead-code --find-unused-psalm-suppress --shepherd --show-info=false --stats --output-format=github --php-version=${{ matrix.php-version }}
        if: matrix.php-version != '8.0'

      - name: "Run vimeo/psalm"
        run: vendor/bin/psalm --find-dead-code --find-unused-psalm-suppress --shepherd --show-info=false --stats --output-format=github --php-version=8.0
        if: matrix.php-version == '8.0'

  tests:
    name: "Tests (PHP: ${{matrix.php-version}}, Symfony: ${{matrix.symfony-version}})"

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - 8.2
          - 8.3
          - 8.4
          - 8.5

        # Every feature must carry a tag from the groups run below (see bin/ci/check-feature-tags.php).
        # Unquoted YAML numbers are rendered without a trailing zero: 7.0 becomes "7" and 8.0 becomes "8".
        symfony-version:
          - 6
          - 7.0
          - 7.4
          - 8.0

        exclude:
          - php-version: 8.2
            symfony-version: 8.0
          - php-version: 8.3
            symfony-version: 8.0

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Install PHP with extensions"
        uses: shivammathur/setup-php@v2
        with:
          coverage: none
          php-version: ${{ matrix.php-version }}
          tools: flex

      - name: "Restrict symfony dependencies to the correct version"
        env:
          SYMFONY_VERSION: ${{ matrix.symfony-version }}
        run: composer config extra.symfony.require "${SYMFONY_VERSION}.*"

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: "Run unit tests with phpunit"
        run: vendor/bin/phpunit --configuration=phpunit.xml

      - name: "Build acceptance tests with codeception"
        run: vendor/bin/codecept build

      - name: "Run acceptance tests with codeception"
        env:
          SYMFONY_VERSION: ${{ matrix.symfony-version }}
        run: |
          major="${SYMFONY_VERSION%%.*}"
          vendor/bin/codecept run -v -g symfony-common -g "symfony-${SYMFONY_VERSION}" -g "symfony-${major}"

  acceptance-tags:
    name: "Acceptance feature tags"

    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Install PHP with extensions"
        uses: shivammathur/setup-php@v2
        with:
          coverage: none
          php-version: 8.4

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: "Check that CI runs every acceptance feature"
        run: php bin/ci/check-feature-tags.php
