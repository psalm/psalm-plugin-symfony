name: "Integrate"

on:
  pull_request: ~
  workflow_dispatch: ~
  push:
    branches:
      - 5.x
  schedule:
    - cron: "0 10 * * 6"

# A new push to a pull request supersedes its running jobs. Pushes to 5.x and scheduled runs get a unique group,
# so they are never cancelled or replaced by a later run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Psalm requires this plugin, and the checkout has no tags to guess its version from: without it, Composer installs
  # an old Psalm release candidate that did not require the plugin.
  COMPOSER_ROOT_VERSION: 5.x-dev

jobs:
  static-code-analysis:
    name: "Static Code Analysis (PHP: ${{matrix.php-version}}, deps: ${{matrix.dependencies}})"

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - 8.2
          - 8.3
          - 8.4
          - 8.5

        dependencies:
          - highest
          - lowest

        exclude:
          - php-version: 8.4
            dependencies: lowest
          - php-version: 8.5
            dependencies: lowest

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Install PHP with extensions"
        uses: shivammathur/setup-php@v2
        with:
          coverage: none
          php-version: ${{ matrix.php-version }}

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: "Cache cache directory for vimeo/psalm"
        uses: actions/cache@v6
        with:
          path: .build/psalm
          key: php-${{ matrix.php-version }}-psalm-${{ github.sha }}
          restore-keys: php-${{ matrix.php-version }}-psalm-

      - name: "Run vimeo/psalm"
        run: vendor/bin/psalm --find-dead-code --find-unused-psalm-suppress --shepherd --show-info=false --stats --output-format=github --php-version=${{ matrix.php-version }}
        if: matrix.php-version != '8.0'

      - name: "Run vimeo/psalm"
        run: vendor/bin/psalm --find-dead-code --find-unused-psalm-suppress --shepherd --show-info=false --stats --output-format=github --php-version=8.0
        if: matrix.php-version == '8.0'

  tests-matrix:
    name: "Tests matrix"

    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      # .github/acceptance-matrix.json lists the PHP and Symfony combinations. Pull requests and pushes run the
      # "always" ones (the lowest and the highest PHP version of every Symfony version). Scheduled and manual runs
      # add the "scheduled-only" ones, then every combination is split into the configured number of shards.
      - name: "Build the Tests matrix"
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          matrix="$(jq --compact-output --arg event "$EVENT_NAME" '
            .shards as $shards
            | (.always + (if $event == "schedule" or $event == "workflow_dispatch" then ."scheduled-only" else [] end))
            | {include: [.[] | . as $combination | range(1; $shards + 1) | $combination + {shard: ., shards: $shards}]}
          ' .github/acceptance-matrix.json)"
          echo "$matrix" | jq .
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  tests:
    name: "Tests (PHP: ${{ matrix.php-version }}, Symfony: ${{ matrix.symfony-version }}, shard: ${{ matrix.shard }}/${{ matrix.shards }})"

    needs: tests-matrix

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.tests-matrix.outputs.matrix) }}

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Install PHP with extensions"
        uses: shivammathur/setup-php@v2
        with:
          coverage: none
          php-version: ${{ matrix.php-version }}
          tools: flex

      - name: "Restrict symfony dependencies to the correct version"
        env:
          SYMFONY_VERSION: ${{ matrix.symfony-version }}
        run: composer config extra.symfony.require "${SYMFONY_VERSION}.*"

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      # The unit tests do not depend on the shard, so only the first one runs them.
      - name: "Run unit tests with phpunit"
        if: matrix.shard == 1
        run: vendor/bin/phpunit --configuration=phpunit.xml

      - name: "Build acceptance tests with codeception"
        run: vendor/bin/codecept build

      - name: "Run acceptance tests with codeception"
        env:
          SYMFONY_VERSION: ${{ matrix.symfony-version }}
          SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
        run: vendor/bin/codecept run -v -g symfony-common -g "symfony-${SYMFONY_VERSION}" --shard "$SHARD"

  # Tracks the unreleased vimeo/psalm master, so a change of Psalm that breaks the plugin shows up before the next
  # release. It never blocks a change: it runs on schedule or on demand only, and a failure does not fail the workflow.
  psalm-dev-master:
    name: "Psalm dev-master canary (PHP: ${{matrix.php-version}}, Symfony: ${{matrix.symfony-version}})"

    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    continue-on-error: true

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: 8.5
            symfony-version: 8.0

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Install PHP with extensions"
        uses: shivammathur/setup-php@v2
        with:
          coverage: none
          php-version: ${{ matrix.php-version }}
          tools: flex

      - name: "Restrict symfony dependencies to the correct version"
        env:
          SYMFONY_VERSION: ${{ matrix.symfony-version }}
        run: composer config extra.symfony.require "$SYMFONY_VERSION.*"

      - name: "Install the unreleased vimeo/psalm"
        run: |
          composer require --no-update --no-interaction vimeo/psalm:dev-master
          composer update --no-interaction --no-progress --prefer-dist

      - name: "Show the installed vimeo/psalm"
        run: composer show vimeo/psalm

      - name: "Run vimeo/psalm"
        run: vendor/bin/psalm --find-dead-code --find-unused-psalm-suppress --show-info=false --stats --output-format=github --php-version="$PHP_VERSION"
        env:
          PHP_VERSION: ${{ matrix.php-version }}

      - name: "Run unit tests with phpunit"
        run: vendor/bin/phpunit --configuration=phpunit.xml

      - name: "Build acceptance tests with codeception"
        run: vendor/bin/codecept build

      - name: "Run acceptance tests with codeception"
        env:
          SYMFONY_VERSION: ${{ matrix.symfony-version }}
        run: vendor/bin/codecept run -v -g symfony-common -g "symfony-$SYMFONY_VERSION"
